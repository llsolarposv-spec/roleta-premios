
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07152f">
<title>Roleta Premiada</title>


<style>
  .company-logo {
  display: block;
  width: min(320px, 85%);
  height: auto;
  max-height: 110px;
  object-fit: contain;
  margin: 5px auto 0px !important;
}
:root {
  --navy: #07152f;
  --navy-light: #102951;
  --gold: #f7c948;
  --gold-light: #ffe9a0;
  --white: #ffffff;
  --green: #19b85a;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 35px 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--white);
  text-align: center;
  background:
    radial-gradient(ellipse at top, #193968 0%, transparent 60%),
    linear-gradient(145deg, #0c2043, var(--navy) 65%);
}

main {
  width: 100%;
  max-width: 490px;
  padding: 30px 22px;
  border: 1px solid rgba(247,201,72,.28);
  border-radius: 28px;
  background: linear-gradient(
    160deg,
    rgba(20,48,87,.94),
    rgba(5,17,39,.98)
  );
  box-shadow: 0 25px 70px rgba(0,0,0,.4);
  overflow: hidden;
}

.eyebrow {
  color: var(--gold);
  text-transform: uppercase;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 3px;
}

h1 {
  margin: 12px 0 10px;
  font-size: clamp(30px, 8vw, 43px);
  line-height: 1.05;
  font-weight: 900;
  letter-spacing: -1px;
}

h1 span {
  display: block;
  color: var(--gold);
}

.subtitle {
  color: #d2def1;
  font-size: 15px;
  line-height: 1.6;
  margin: 6px auto 12px;
  max-width: 340px;
}

.wheel-box {
  position: relative;
  width: min(100%, 390px);
  margin: 16px auto 14px;
  filter: drop-shadow(0 12px 18px rgba(0,0,0,.35));
}

canvas {
  display: block;
  width: 100%;
  height: auto;
}

.pointer {
  position: absolute;
  z-index: 2;
  top: -5px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 17px solid transparent;
  border-right: 17px solid transparent;
  border-top: 38px solid var(--gold);
  filter: drop-shadow(0 3px 2px #000);
}

button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 58px;
  padding: 16px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: .5px;
  cursor: pointer;
  transition: transform .2s, filter .2s, box-shadow .2s;
}

button:hover:not(:disabled) {
  transform: translateY(-2px);
  filter: brightness(1.08);
}

button:focus-visible {
  outline: 3px solid white;
  outline-offset: 4px;
}

#spin {
  color: #102344;
  background: linear-gradient(135deg, #fff0a9, #f7c948 55%, #e8a91c);
  border: 1px solid #ffe9a0;
  box-shadow: 0 6px 0 #a87512, 0 12px 25px rgba(247,201,72,.16);
}

#spin:disabled {
  opacity: .75;
  cursor: wait;
}

#result {
  display: none;
  margin: 23px 0 12px;
  padding: 22px 15px;
  border: 1px solid rgba(247,201,72,.6);
  border-radius: 17px;
  background: linear-gradient(135deg, #17365f, #0b1c39);
  animation: aparecer .45s ease both;
}

.result-label {
  color: var(--gold);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
}

#prize-name {
  margin-top: 9px;
  font-size: 24px;
  font-weight: 900;
  overflow-wrap: anywhere;
}

#whatsapp {
  display: none;
  color: white;
  background: linear-gradient(135deg, #25d366, #0d9e4a);
  border: 1px solid rgba(255,255,255,.2);
  box-shadow: 0 7px 20px rgba(25,184,90,.18);
  margin-top: 14px;
}

.whatsapp-icon {
  font-size: 23px;
}

.rules {
  margin: 24px 0 0;
  color: #aabbd5;
  font-size: 11px;
  line-height: 1.7;
}

.footer {
  margin-top: 17px;
  color: #8297b7;
  font-size: 10px;
  letter-spacing: 1px;
}

@keyframes aparecer {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 400px) {
  main { padding: 25px 15px; }
  .subtitle { font-size: 14px; }
  button { font-size: 13px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}


.company-logo {
  display: block !important;
  width: 360px !important;
  max-width: 90% !important;
  height: auto !important;
  max-height: none !important;
  object-fit: contain;
  margin: -5px auto 0px;
}

}

</style>
</head>

<body>
<main>
  <div class="eyebrow">Uma surpresa espera por você</div>

  <h1>ROLETA <span>PREMIADA</span></h1>


<div class="logo-container">
  <img src="./logo.png" alt="LL Solar" class="company-logo">
</div>

  <p class="subtitle">
    Gire a roleta e descubra o seu prêmio!
  </p>

  <div class="wheel-box">
    <div class="pointer"></div>
    <canvas id="wheel" width="700" height="700"
      role="img" aria-label="Roleta com seis opções de prêmios"></canvas>
  </div>

  <button id="spin" type="button">
    <span>↻</span> GIRAR A ROLETA
  </button>

  <section id="result" aria-live="polite">
    <div class="result-label">✦ Parabéns você acaba de ganhar um super desconto ✦</div>
    <div id="prize-name"></div>
  </section>

  <button id="whatsapp" type="button">
    <span class="whatsapp-icon">🎁</span>
    RESGATAR MEU PRÊMIO
  </button>

  <p class="rules">
    Consulte as regras, condições e prazo de resgate da promoção.
    O resultado precisa ser validado pela empresa.
  </p>

  <div class="footer">UMA EXPERIÊNCIA ESPECIAL PARA VOCÊ</div>
</main>

<script>
/* PERSONALIZE AQUI OS NOMES DOS PRÊMIOS */
const premios = [
  "R$ 200,00",
  "R$ 500,00",
  "R$ 1.000,00",
  "R$ 200,00",
  "R$ 500,00",
  "R$ 1.000,00"
];

/* CORES DA ROLETA */
const cores = [
  "#15396c",
  "#087eac",
  "#e8a927",
  "#15396c",
  "#087eac",
  "#e8a927"
];

/*
  MANTENHA AQUI O NÚMERO QUE VOCÊ JÁ CONFIGUROU.
  Formato: 55 + DDD + número, sem símbolos.
*/
const telefone = "5584991442046";

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const botao = document.getElementById("spin");
const botaoWhats = document.getElementById("whatsapp");
const resultado = document.getElementById("result");
const nomePremio = document.getElementById("prize-name");

const centro = 350;
const raio = 325;
const arco = (2 * Math.PI) / premios.length;

let rotacao = 0;
let girando = false;
let jaGirou = false;
let premioAtual = "";

function desenhar() {
  ctx.clearRect(0, 0, 700, 700);
  ctx.save();
  ctx.translate(centro, centro);
  ctx.rotate(rotacao);

  premios.forEach((premio, i) => {
    const inicio = -Math.PI / 2 + i * arco;

    /* Fatia da roleta */
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, raio, inicio, inicio + arco);
    ctx.closePath();
    ctx.fillStyle = cores[i % cores.length];
    ctx.fill();

    ctx.strokeStyle = "#fff0b5";
    ctx.lineWidth = 3;
    ctx.stroke();

    /* Texto de cada prêmio */
    ctx.save();
    ctx.rotate(inicio + arco / 2);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 23px Arial";

    ctx.shadowColor = "rgba(0,0,0,.35)";
    ctx.shadowBlur = 3;

    let texto = premio;
    if (texto.length > 19) {
      texto = texto.slice(0, 18) + "…";
    }

    ctx.fillText(texto, raio - 32, 0, 220);
    ctx.restore();
  });

  ctx.restore();

  /* Aro externo dourado */
  ctx.beginPath();
  ctx.arc(centro, centro, raio + 5, 0, 2 * Math.PI);
  ctx.strokeStyle = "#f7c948";
  ctx.lineWidth = 10;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(centro, centro, raio + 13, 0, 2 * Math.PI);
  ctx.strokeStyle = "#b98220";
  ctx.lineWidth = 3;
  ctx.stroke();

  /* Centro da roleta */
  const brilho = ctx.createRadialGradient(
    centro - 12, centro - 12, 3,
    centro, centro, 35
  );
  brilho.addColorStop(0, "#fff4bd");
  brilho.addColorStop(.55, "#f7c948");
  brilho.addColorStop(1, "#b98220");

  ctx.beginPath();
  ctx.arc(centro, centro, 34, 0, 2 * Math.PI);
  ctx.fillStyle = brilho;
  ctx.fill();
  ctx.strokeStyle = "#fff0b5";
  ctx.lineWidth = 4;
  ctx.stroke();
}

desenhar();

botao.addEventListener("click", () => {
  if (girando || jaGirou) return;

  girando = true;
  startRouletteSound();
  
  botao.disabled = true;
  botao.innerHTML = "<span>↻</span> BOA SORTE!";
  resultado.style.display = "none";
  botaoWhats.style.display = "none";

  /*
    Nesta versão de demonstração, todos os prêmios
    têm a mesma chance de serem selecionados.
  */
  const indice = premios.indexOf("R$ 1.000,00");

if (indice === -1) {
  alert('Adicione o prêmio "1.000,00" à lista de prêmios.');
  girando = false;
  botao.disabled = false;
  return;
}
  const inicio = rotacao;

  /* Alinha o centro da fatia sorteada com o ponteiro */
  const alvo = -((indice + 0.5) * arco);
  const diferenca =
    ((alvo - inicio % (2 * Math.PI)) + 4 * Math.PI) %
    (2 * Math.PI);

  const destino = inicio + 6 * 2 * Math.PI + diferenca;
  const tempoInicio = performance.now();
  const duracao = 4800;

  function animar(agora) {
    const progresso = Math.min(
      (agora - tempoInicio) / duracao, 1
    );
    const suave = 1 - Math.pow(1 - progresso, 4);

    rotacao = inicio + (destino - inicio) * suave;
    desenhar();

    if (progresso < 1) {
      requestAnimationFrame(animar);
    } else {
      rotacao = destino % (2 * Math.PI);
      desenhar();
      
stopRouletteSound();
playCoinsSound();
      
      premioAtual = premios[indice];
      nomePremio.textContent = premioAtual;

      resultado.style.display = "block";
      botaoWhats.style.display = "flex";
      botao.textContent = "PRÊMIO REVELADO";
      girando = false;
      jaGirou = true;
    }
  }

  requestAnimationFrame(animar);
});

botaoWhats.addEventListener("click", () => {
  if (!premioAtual) return;

  if (!/^\d{12,13}$/.test(telefone)) {
    alert("Configure o número do WhatsApp no código.");
    return;
  }

  const mensagem =
    `Olá! 🎉 Ganhei R$ 1.000,00 de desconto na minha usina solar pela roleta premiada da LL Solar! 🏆💙`;

  const link =
    "https://wa.me/" + telefone +
    "?text=" + encodeURIComponent(mensagem);

  window.open(link, "_blank", "noopener,noreferrer");
});
</script>
<script>
let audioContext;
let rouletteSoundTimer = null;

function getAudioContext() {
  if (!audioContext) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) audioContext = new AudioCtx();
  }

  if (audioContext?.state === "suspended") {
    audioContext.resume();
  }

  return audioContext;
}

function playRouletteClick() {
  const ctx = getAudioContext();
  if (!ctx) return;

  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = "square";
  osc.frequency.setValueAtTime(1200 + Math.random() * 500, now);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.07, now + 0.003);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.025);

  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.03);
}

function startRouletteSound() {
  getAudioContext();
  stopRouletteSound();

  let interval = 45;

  function tick() {
    playRouletteClick();
    interval = Math.min(interval + 8, 180);
    rouletteSoundTimer = setTimeout(tick, interval);
  }

  tick();
}

function stopRouletteSound() {
  if (rouletteSoundTimer !== null) {
    clearTimeout(rouletteSoundTimer);
    rouletteSoundTimer = null;
  }
}

function playCoinsSound() {
  const ctx = getAudioContext();
  if (!ctx) return;

  const tocar = () => {
    const notes = [987.77, 1318.51, 1567.98, 1975.53, 1567.98, 1318.51];

    notes.forEach((freq, i) => {
      const now = ctx.currentTime + i * 0.13;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.36);
    });
  };

  if (ctx.state === "suspended") {
    ctx.resume().then(tocar);
  } else {
    tocar();
  }
}
</script>
</body>
</html>
